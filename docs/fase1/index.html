<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UBite - Cafeteria UMB</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #ffffff;
    color: #333333;
    margin: 0;
    padding: 20px;
  }

  .contenedor {
    max-width: 500px;
    margin: 0 auto;
    border: 1px solid #cccccc;
    padding: 20px;
  }

  h1 {
    font-size: 22px;
    color: #2b2b2b;
    text-align: center;
  }

  h2 {
    font-size: 16px;
    color: #444444;
    margin-top: 25px;
    border-bottom: 1px solid #dddddd;
    padding-bottom: 5px;
  }

  p {
    font-size: 14px;
    line-height: 1.5;
  }

  label {
    display: block;
    font-size: 14px;
    margin-top: 12px;
    margin-bottom: 4px;
  }

  input, select {
    width: 100%;
    padding: 6px;
    font-size: 14px;
    border: 1px solid #999999;
  }

  button {
    margin-top: 20px;
    width: 100%;
    padding: 10px;
    background-color: #4a7c59;
    color: white;
    border: none;
    font-size: 15px;
    cursor: pointer;
  }

  .pantalla {
    margin-top: 30px;
    border-top: 2px dashed #aaaaaa;
    padding-top: 20px;
  }

  .estado {
    border: 1px solid #b7d9b7;
    padding: 10px;
    font-size: 14px;
    margin-top: 15px;
  }

  .etiqueta {
    font-size: 12px;
    color: #777777;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div class="contenedor">

  <h1>UBite</h1>

  <h2>Formulario de pedido</h2>

  <label for="nombre">Nombre:</label>
  <input type="text" id="nombre" placeholder="Escriba su nombre">

  <label for="telefono">Telefono:</label>
  <input type="text" id="telefono" placeholder="Ej: 3001234567">

  <label for="producto">Producto:</label>
  <select id="producto">
    <option>Cafe americano</option>
    <option>Croissant</option>
    <option>Jugo natural</option>
  </select>

  <label for="cantidad">Cantidad:</label>
  <input type="number" id="cantidad" value="1">

  <button>Enviar pedido</button>

  <div class="pantalla">
    <h2>Confirmacion del pedido</h2>

    <p><strong>Pedido:</strong> 1 Cafe americano</p>
    <p><strong>Nombre:</strong> (dato ingresado por el usuario)</p>

    <div class="estado">
    Se le notificara al telefono cuando este listo.
    </div>
  </div>

</div>

</body>
</html>
